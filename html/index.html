<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' pills-sound:; style-src 'self' 'unsafe-inline'" />
    <meta http-equiv="X-Content-Security-Policy" content="default-src 'self'; script-src 'self'; media-src 'self' pills-sound:; style-src 'self' 'unsafe-inline'" />
    <link rel="stylesheet" href="../assets/css/fonts.css" />
    <link rel="stylesheet" href="../assets/css/app.css" />
    <title>PillsNative</title>
</head>
<body>
<div class="app">
    <header class="titlebar">
        <div class="titlebar__drag" id="titlebarDrag"></div>
        <div class="titlebar__brand">PillsNative</div>
        <div class="traffic-lights" aria-label="Управление окном">
            <button type="button" class="traffic-light traffic-light--minimize" id="winMinimize" title="Свернуть" aria-label="Свернуть">
                <span class="traffic-light__dot"></span>
            </button>
            <button type="button" class="traffic-light traffic-light--maximize" id="winMaximize" title="Развернуть" aria-label="Развернуть">
                <span class="traffic-light__dot"></span>
            </button>
            <button type="button" class="traffic-light traffic-light--close" id="winClose" title="Закрыть" aria-label="Закрыть">
                <span class="traffic-light__dot"></span>
            </button>
        </div>
    </header>

    <div class="app__main">
        <div class="toolbar">
            <div class="toolbar__left">
                <div class="toolbar__title" id="toolbarTitle">Приёмы</div>
                <div class="toolbar__subtitle" id="toolbarSubtitle">Напоминания о лекарствах</div>
            </div>
            <div class="toolbar__actions">
                <div class="test-alarm" id="testAlarmWrap" hidden>
                    <button type="button" class="btn-icon" id="testAlarm" title="Тест будильника" aria-label="Тест будильника" aria-haspopup="menu">
                        <svg class="btn-icon__svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M8.13602 1.6026C8.35556 1.95386 8.24877 2.41657 7.89752 2.6361L3.8975 5.1361C3.54624 5.35563 3.08353 5.24885 2.864 4.8976C2.64447 4.54634 2.75125 4.08363 3.1025 3.8641L7.10253 1.3641C7.45378 1.14457 7.91649 1.25135 8.13602 1.6026ZM15.864 1.6026C16.0835 1.25135 16.5462 1.14457 16.8975 1.3641L20.8975 3.8641C21.2488 4.08363 21.3555 4.54635 21.136 4.8976C20.9165 5.24885 20.4538 5.35563 20.1025 5.1361L16.1025 2.6361C15.7512 2.41657 15.6445 1.95385 15.864 1.6026ZM12 4.7501C7.44365 4.7501 3.75 8.44375 3.75 13.0001C3.75 17.5564 7.44365 21.2501 12 21.2501C16.5563 21.2501 20.25 17.5564 20.25 13.0001C20.25 8.44375 16.5563 4.7501 12 4.7501ZM2.25 13.0001C2.25 7.61532 6.61522 3.2501 12 3.2501C17.3848 3.2501 21.75 7.61532 21.75 13.0001C21.75 18.3849 17.3848 22.7501 12 22.7501C6.61522 22.7501 2.25 18.3849 2.25 13.0001ZM12 8.2501C12.4142 8.2501 12.75 8.58589 12.75 9.0001V12.6894L15.0303 14.9698C15.3232 15.2627 15.3232 15.7375 15.0303 16.0304C14.7374 16.3233 14.2626 16.3233 13.9697 16.0304L11.4697 13.5304C11.329 13.3898 11.25 13.199 11.25 13.0001V9.0001C11.25 8.58589 11.5858 8.2501 12 8.2501Z" fill="currentColor"/>
                        </svg>
                    </button>
                    <div class="test-alarm__menu" id="testAlarmMenu" role="menu" hidden>
                        <button type="button" class="test-alarm__option" data-delay="0">Сейчас</button>
                        <button type="button" class="test-alarm__option" data-delay="10">Через 10 секунд</button>
                        <button type="button" class="test-alarm__option" data-delay="30">Через 30 секунд</button>
                        <button type="button" class="test-alarm__option" data-delay="60">Через 1 минуту</button>
                    </div>
                </div>
                <button type="button" class="btn-icon" id="openSettings" title="Настройки" aria-label="Настройки">
                    <svg class="btn-icon__svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 8.25C9.92894 8.25 8.25 9.92893 8.25 12C8.25 14.0711 9.92894 15.75 12 15.75C14.0711 15.75 15.75 14.0711 15.75 12C15.75 9.92893 14.0711 8.25 12 8.25ZM9.75 12C9.75 10.7574 10.7574 9.75 12 9.75C13.2426 9.75 14.25 10.7574 14.25 12C14.25 13.2426 13.2426 14.25 12 14.25C10.7574 14.25 9.75 13.2426 9.75 12Z" fill="currentColor"/>

                    </svg>
                </button>
                <button type="button" class="btn-icon" id="toggleForm" title="Добавить приём" aria-label="Добавить приём">
                    <svg class="btn-icon__svg" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12.75 9C12.75 8.58579 12.4142 8.25 12 8.25C11.5858 8.25 11.25 8.58579 11.25 9L11.25 11.25H9C8.58579 11.25 8.25 11.5858 8.25 12C8.25 12.4142 8.58579 12.75 9 12.75H11.25V15C11.25 15.4142 11.5858 15.75 12 15.75C12.4142 15.75 12.75 15.4142 12.75 15L12.75 12.75H15C15.4142 12.75 15.75 12.4142 15.75 12C15.75 11.5858 15.4142 11.25 15 11.25H12.75V9Z" fill="currentColor"/>
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 1.25C6.06294 1.25 1.25 6.06294 1.25 12C1.25 17.9371 6.06294 22.75 12 22.75C17.9371 22.75 22.75 17.9371 22.75 12C22.75 6.06294 17.9371 1.25 12 1.25ZM2.75 12C2.75 6.89137 6.89137 2.75 12 2.75C17.1086 2.75 21.25 6.89137 21.25 12C21.25 17.1086 17.1086 21.25 12 21.25C6.89137 21.25 2.75 17.1086 2.75 12Z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="content">
            <section class="view is-active" id="listView">
                <div class="list-shell">
                    <div class="search">
                        <input id="search" type="text" placeholder="Поиск по названию…" />
                    </div>
                    <div class="pill-list" id="pillList"></div>
                    <div class="empty-state hidden" id="emptyState">
                        <h2>Пока пусто</h2>
                        <p>Добавьте первый приём — приложение напомнит, когда пора принять лекарство.</p>
                    </div>
                    <div class="list-footer">
                        <button type="button" class="btn btn-primary" id="addPillFooter">Добавить приём</button>
                    </div>
                </div>
            </section>

            <section class="view" id="formView">
                <div class="panel">
                    <div class="panel__heading">
                        <span id="formHeading">Новый приём</span>
                        <button type="button" class="btn-icon" id="closeForm" title="Закрыть" aria-label="Закрыть">
                            <svg class="btn-icon__svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>

                    <div class="form" id="addPillsForm">
                        <div class="field">
                            <label for="drugName">Препарат</label>
                            <div class="suggest" id="drugSuggest">
                                <input id="drugName" type="text" placeholder="Например, Витамин D" autocomplete="off" />
                                <div class="suggest__menu" id="drugSuggestMenu" role="listbox" hidden></div>
                            </div>
                        </div>
                        <div class="field">
                            <label for="dosage">Дозировка</label>
                            <div class="suggest" id="dosageSuggest">
                                <input id="dosage" type="text" placeholder="1 таблетка" autocomplete="off" />
                                <div class="suggest__menu" id="dosageSuggestMenu" role="listbox" hidden></div>
                            </div>
                        </div>
                        <div class="field-row">
                            <div class="field" id="dateField">
                                <span class="field__label">Дата</span>
                                <div class="picker" id="datePicker">
                                    <input id="date" type="hidden" />
                                    <button type="button" class="picker__trigger" id="dateTrigger" aria-haspopup="dialog">
                                        <span class="picker__icon" aria-hidden="true">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                                <path d="M7 3v2M17 3v2M4.5 9h15M6.5 5h11A2 2 0 0 1 19.5 7v12a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                                            </svg>
                                        </span>
                                        <span class="picker__value is-placeholder" id="dateDisplay">Выберите дату</span>
                                        <span class="picker__chevron" aria-hidden="true">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                                <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="picker__popover" id="datePopover" role="dialog" aria-label="Календарь" hidden>
                                        <div class="calendar">
                                            <div class="calendar__header">
                                                <button type="button" class="calendar__nav" id="calPrev" aria-label="Предыдущий месяц">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M14.5 6L8.5 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                                </button>
                                                <div class="calendar__title" id="calTitle"></div>
                                                <button type="button" class="calendar__nav" id="calNext" aria-label="Следующий месяц">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                                                </button>
                                            </div>
                                            <div class="calendar__weekdays">
                                                <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                                            </div>
                                            <div class="calendar__grid" id="calGrid"></div>
                                            <div class="calendar__footer">
                                                <button type="button" class="calendar__today" id="calToday">Сегодня</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="field">
                                <span class="field__label">Время</span>
                                <div class="picker" id="timePicker">
                                    <input id="time" type="hidden" />
                                    <button type="button" class="picker__trigger" id="timeTrigger" aria-haspopup="dialog">
                                        <span class="picker__icon" aria-hidden="true">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                                <path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                        <span class="picker__value is-placeholder" id="timeDisplay">Выберите время</span>
                                        <span class="picker__chevron" aria-hidden="true">
                                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none">
                                                <path d="M7 10l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="picker__popover picker__popover--time" id="timePopover" role="dialog" aria-label="Выбор времени" hidden>
                                        <div class="time-picker">
                                            <div class="time-picker__columns">
                                                <div class="time-picker__col">
                                                    <div class="time-picker__label">Часы</div>
                                                    <div class="time-picker__list" id="hourList"></div>
                                                </div>
                                                <div class="time-picker__divider">:</div>
                                                <div class="time-picker__col">
                                                    <div class="time-picker__label">Минуты</div>
                                                    <div class="time-picker__list" id="minuteList"></div>
                                                </div>
                                            </div>
                                            <div class="time-picker__footer">
                                                <button type="button" class="btn btn-primary time-picker__apply" id="timeApply">Готово</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <label class="check-field" id="notifyDailyField" for="notifyDaily">
                            <span class="checkbox">
                                <input id="notifyDaily" type="checkbox" />
                                <span class="checkbox__box" aria-hidden="true">
                                    <svg class="checkbox__check" width="12" height="12" viewBox="0 0 24 24" fill="none">
                                        <path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                            </span>
                            <span class="check-field__text">
                                <span class="check-field__title">Уведомлять каждый день</span>
                                <span class="check-field__hint">Дата не потребуется</span>
                            </span>
                        </label>
                        <div class="field">
                            <label for="description">Описание</label>
                            <textarea id="description" placeholder="Необязательно"></textarea>
                        </div>

                        <div id="error" class="error-box"></div>
                        <div id="success" class="success-box"></div>

                        <div class="form__actions">
                            <div class="form__actions-row">
                                <button type="button" class="btn btn-secondary" id="cancelForm">Отмена</button>
                                <button type="button" class="btn btn-primary" id="save">Сохранить</button>
                            </div>
                            <button type="button" class="btn btn-danger hidden" id="delete">Удалить</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</div>

<div class="settings-backdrop" id="settingsBackdrop"></div>
<aside class="settings-panel" id="settingsPanel" aria-hidden="true">
    <div class="settings-panel__header">
        <div class="settings-panel__title">Настройки</div>
        <button type="button" class="btn-icon" id="closeSettings" title="Закрыть" aria-label="Закрыть">
            <svg class="btn-icon__svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            </svg>
        </button>
    </div>
    <div class="settings-panel__body">
        <section class="settings-section">
            <div class="settings-section__label">Тема</div>
            <div class="settings-options" id="themeOptions">
                <button type="button" class="settings-option" data-theme="dark">Тёмная</button>
                <button type="button" class="settings-option" data-theme="light">Светлая</button>
            </div>
        </section>
        <section class="settings-section">
            <div class="settings-section__label">Звук будильника</div>
            <p class="settings-section__hint">Короткие сигналы или своя музыка. Файл будет зациклен на будильнике.</p>
            <div class="sound-list" id="soundList"></div>
            <button type="button" class="btn btn-secondary settings-upload" id="addCustomSound">Загрузить свою музыку</button>
        </section>
    </div>
</aside>

<div class="toast" id="toast" hidden></div>
<audio id="settingsPreviewAudio" preload="auto"></audio>
<audio id="alarmAudio" src="../assets/sounds/soft-marimba.wav" preload="auto" loop></audio>
<script src="../renderer.js"></script>
</body>
</html>
